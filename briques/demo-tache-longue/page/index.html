<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>demo-tache-longue</title>
<link rel="stylesheet" href="/statique/style.css">
<style>
  body { padding: 0; } input { width: 160px; }
  .etat { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; color: var(--sourd); white-space: pre-wrap; margin-top: 6px; }
  .termine .barre div { background: var(--ok); } .annule .barre div { background: var(--sourd-2); } .echec .barre div { background: var(--critique); }
  ul { padding-left: 18px; color: var(--sourd); font-size: 14px; }
</style>
</head>
<body class="page-brique">
<h1>⏳ Démonstration : tâche longue</h1>
<p class="sourd">L'état vit sur le disque (<code>taches/&lt;nom&gt;.progres.json</code>). Rafraîchissez la page pendant le travail : rien n'est perdu. « Annuler » pose un drapeau que la tâche consulte à chaque bloc.</p>
<div style="display:flex;gap:12px;align-items:end;flex-wrap:wrap">
  <div><label>Nom de la tâche</label><input id="nom" value="essai"></div>
  <div><label>Blocs</label><input id="blocs" type="number" min="1" value="20"></div>
  <div><label>Durée d'un bloc (s)</label><input id="duree" type="number" min="0" step="0.1" value="0.5"></div>
  <div><button class="principal" id="lancer" onclick="lancer()">▶ Lancer</button><button id="annuler" onclick="annuler()" disabled>■ Annuler</button></div>
</div>
<div id="suivi">
  <div class="barre"><div id="remplissage"></div></div>
  <div class="etat" id="etat">aucune tâche suivie</div>
</div>
<h2>Tâches connues sur le disque</h2>
<ul id="liste"></ul>
<script>
// La page est servie par le hub sous /pages/<brique>/ ; les API de tâches sont sous /taches/<brique>/…
const BRIQUE = location.pathname.split("/")[2];
const api = (u, o) => fetch(u, o).then(r => r.json());
let suivi = localStorage.getItem("tache-suivie") || null;   // seul « confort » gardé dans l'onglet : quelle tâche regarder

async function lancer() {
  const nom = document.getElementById("nom").value.trim();
  const r = await api(`/api/lancer-tache/${BRIQUE}/travailler`, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ nom, blocs: parseInt(document.getElementById("blocs").value, 10), duree_bloc_s: parseFloat(document.getElementById("duree").value) }) });
  if (r.erreur) { document.getElementById("etat").textContent = r.erreur.cause + "\n" + (r.erreur.remede || ""); return; }
  suivi = nom; localStorage.setItem("tache-suivie", nom);
}
async function annuler() { if (suivi) await api(`/taches/${BRIQUE}/${suivi}/annuler`, { method: "POST" }); }

async function rafraichir() {
  const liste = await api(`/taches/${BRIQUE}/`);
  document.getElementById("liste").replaceChildren(...liste.map(t => { const li = document.createElement("li"); li.textContent = `${t.tache} — ${t.etat} ${t.pourcentage}% ${t.etape || ""}`; li.style.cursor = "pointer"; li.onclick = () => { suivi = t.tache; localStorage.setItem("tache-suivie", suivi); }; return li; }));
  if (!suivi) return;
  const t = await api(`/taches/${BRIQUE}/${suivi}`);
  const bloc = document.getElementById("suivi"); bloc.className = t.etat;
  document.getElementById("remplissage").style.width = `${t.pourcentage}%`;
  document.getElementById("etat").textContent = `${t.tache} : ${t.etat} — ${t.pourcentage}% — ${t.etape || ""}` + (t.eta_s !== undefined && t.etat === "en_cours" ? ` — reste ≈ ${Math.round(t.eta_s)} s` : "") + (t.resultat ? `\nrésultat : ${t.resultat}` : "") + (t.erreur ? `\nerreur : ${t.erreur_texte || t.erreur}` : "");
  document.getElementById("annuler").disabled = t.etat !== "en_cours";
  document.getElementById("lancer").disabled = t.etat === "en_cours";
}
rafraichir(); setInterval(rafraichir, 1000);
</script>
</body>
</html>
